[options]
Architecture = auto
HoldPkg = pacman coast-base
# Linux-compatible ramfs reports unknown capacity; enable CheckSpace when
# a persistent filesystem with meaningful free-space accounting is available.
Color
ParallelDownloads = 1
SigLevel = Required
LocalFileSigLevel = Optional
DownloadUser = alpm
# Upstream libalpm downloads as alpm with Landlock, seccomp and no_new_privs.
# The builder selects the HTTP(S) origin or an embedded file mirror.

[coast]
Server = file:///var/lib/coast/repository/coast/os/$arch
