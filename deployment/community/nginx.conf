pid /run/coast/nginx.pid;
user aur;
error_log /dev/stderr warn;
worker_processes 2;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    client_body_temp_path /run/coast/body;
    proxy_temp_path /run/coast/proxy;
    fastcgi_temp_path /run/coast/fastcgi;
    uwsgi_temp_path /run/coast/uwsgi;
    scgi_temp_path /run/coast/scgi;
    map $host $coast_host { default 0; 127.0.0.1 1; localhost 1; 10.0.2.2 1; }
    server {
        listen 8000;
        server_name 127.0.0.1 localhost 10.0.2.2;
        if ($coast_host = 0) { return 403; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        location ~ "^/([a-z0-9][a-z0-9.+_-]*?)(\.git)?/(git-upload-pack|HEAD|info/refs|objects/(info/(http-)?alternates|packs)|[0-9a-f]{2}/[0-9a-f]{38}|pack/pack-[0-9a-f]{40}\.(pack|idx))$" {
            if ($arg_service = git-receive-pack) { return 403; }
            include /etc/nginx/uwsgi_params;
            uwsgi_pass unix:/run/coast/sockets/git-http.sock;
            uwsgi_modifier1 9;
            uwsgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
            uwsgi_param PATH_INFO /aur.git/$3;
            uwsgi_param GIT_HTTP_EXPORT_ALL "";
            uwsgi_param GIT_NAMESPACE $1;
            uwsgi_param GIT_PROJECT_ROOT /data/git;
        }
        location ~ /git-receive-pack$ { return 403; }
        location ~ ^/cgit {
            include /etc/nginx/uwsgi_params;
            rewrite ^/cgit/([^?]*)?$ /cgit.cgi?url=$1&$args break;
            uwsgi_modifier1 9;
            uwsgi_param SCRIPT_FILENAME /usr/lib/cgit-aurweb/cgit.cgi;
            uwsgi_param CGIT_CONFIG /run/coast/cgitrc;
            uwsgi_pass unix:/run/coast/sockets/cgit.sock;
        }
        location = /css/cgit.css { alias /usr/share/webapps/cgit-aurweb/cgit.css; }
        location = /cgit.js { alias /usr/share/webapps/cgit-aurweb/cgit.js; }
        location = /packages-meta-ext-v1.json.gz { alias /data/archives/packages-meta-ext-v1.json.gz; }
        location = /packages-meta-v1.json.gz { alias /data/archives/packages-meta-v1.json.gz; }
        location = /packages.gz { alias /data/archives/packages.gz; }
        location = /pkgbase.gz { alias /data/archives/pkgbase.gz; }
        location = /guidelines { alias /opt/coast/guidelines.html; default_type text/html; }
        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
