# Shared ModernOS boot policy, in TOML. Native loader settings belong in
# scripts/bootloaders/limine.conf.in, grub.cfg.in or refind.conf.in.
version = 1

[boot]
title = "ModernOS"
kernel = "/boot/kernel.elf"
resolution = "2560x1600x32"
cmdline = ""

[[boot.modules]]
path = "/boot/initramfs.tar"
string = "initramfs"

[menu]
# Seconds before automatic boot: 0 boots immediately; -1 waits indefinitely.
timeout = 0
resolution = "2560x1600x32"
wallpaper = "/boot/boot-background.jpg"
